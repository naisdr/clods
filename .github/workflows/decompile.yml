name: Analyze and Decompile Kentang Injector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install APKTool
        run: |
          set -e
          APKTOOL_VERSION="2.11.1"
          curl -L "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" -o apktool.jar
          printf '#!/usr/bin/env bash\nexec java -jar "$(dirname "$0")/apktool.jar" "$@"\n' > apktool
          chmod +x apktool
          sudo mv apktool apktool.jar /usr/local/bin/

      - name: Download JADX
        run: |
          set -e
          JADX_VERSION="1.5.1"
          curl -L "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip" -o jadx.zip
          mkdir jadx
          unzip -q jadx.zip -d jadx
          echo "$GITHUB_WORKSPACE/jadx/bin" >> "$GITHUB_PATH"

      - name: Verify input APK
        run: |
          test -f input/kentang-injector-2.7.0.apk
          file input/kentang-injector-2.7.0.apk
          sha256sum input/kentang-injector-2.7.0.apk

      - name: Decode resources and manifest
        run: |
          apktool d -f input/kentang-injector-2.7.0.apk -o output/apktool

      - name: Decompile DEX to Java view
        run: |
          jadx --show-bad-code -d output/jadx input/kentang-injector-2.7.0.apk

      - name: Save analysis metadata
        run: |
          mkdir -p output
          {
            echo "APK: kentang-injector-2.7.0.apk"
            echo "SHA256:"
            sha256sum input/kentang-injector-2.7.0.apk
            echo
            echo "APK entries:"
            unzip -l input/kentang-injector-2.7.0.apk
          } > output/apk-metadata.txt

      - name: Upload decompiled project artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kentang-injector-decompiled-analysis
          path: output/
          if-no-files-found: error
          retention-days: 14
